<!doctype html>
<!-- POZOR (feat-023, 2026-10-20): maketa vznikla před feat-023 a ukazuje písma Archivo a Kalam. Aplikace od feat-023 používá jen JetBrains Mono (včetně titulků, záložek a tlačítek); maketa je historický podklad feat-021. -->

<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Org Flow Simulator — design system mockup</title>
<!--
  Maketa aplikace v design systému Org Flow (paleta Antracit a elektrická modř) (https://claude.ai/artifact/EvHZ56JjHa9D9etc85fy3Q).
  Samostatný soubor: tokeny a styly komponent jsou vložené níže. Simulace je zjednodušená hračka
  jen pro předvedení pohybu — nepoužívá engine aplikace a její čísla nic netvrdí.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<style>
/* Org Flow tokens — generated from tokens.json */
:root, [data-theme="light"] {
  --surface-page: #f3f3f3;
  --surface-panel: #ffffff;
  --surface-subtle: #f9f9f9;
  --surface-raised: #ffffff;
  --surface-paper: #f4efe3;
  --surface-highlight: #f7f1d3;
  --surface-bar: #121212;
  --ink: #121212;
  --ink-2: #484848;
  --ink-3: #696969;
  --ink-4: #989898;
  --ink-on-bar: #dedede;
  --ink-inverse: #ffffff;
  --line: #dbdbdb;
  --line-2: #e8e8e8;
  --line-control: #898989;
  --line-ink: #121212;
  --line-on-bar: #ffffff2e;
  --track: #1212120f;
  --action: #2b59ff;
  --action-hover: #1d43ea;
  --on-action: #ffffff;
  --accent: #7a3bf0;
  --accent-soft: #f3f1ff;
  --on-accent: #ffffff;
  --highlight: #ffe14d;
  --highlight-ink: #7a6400;
  --focus: #7a3bf0;
  --focus-on-bar: #ffe14d;
  --done: #097f43;
  --done-soft: #ebf6e6;
  --on-done: #ffffff;
  --wait: #8d672b;
  --wait-soft: #fcf1d2;
  --rework: #b3261e;
  --rework-soft: #fceceb;
  --rework-line: #eab0ab;
  --role-rose: #bf406e;
  --role-blue: #1075ac;
  --role-brick: #a14a1c;
  --role-green: #097f43;
  --role-ochre: #8d672b;
  --role-teal: #0b7a75;
  --role-violet: #815ea9;
  --role-slate: #4f5a6b;
  --map-directing: #1075ac;
  --map-driving: #097f43;
  --map-doing: #815ea9;
  --map-delivering: #bf406e;
  --map-field-directing: #eef6fc;
  --map-field-driving: #eef7ef;
  --map-field-doing: #f5f0fa;
  --map-field-delivering: #fcf0f4;
  --shadow-card: 0 1px 2px #12121214;
  --shadow-pop: 0 12px 32px -8px #12121240, 0 2px 6px #1212121f;
  --shadow-focus: 0 0 0 2px #ffffff, 0 0 0 4px #7a3bf0;
}
[data-theme="dark"] {
  --surface-page: #0f0f0f;
  --surface-panel: #191919;
  --surface-subtle: #141414;
  --surface-raised: #252525;
  --surface-paper: #2a2a26;
  --surface-highlight: #332e15;
  --surface-bar: #060606;
  --ink: #eeeeee;
  --ink-2: #cacaca;
  --ink-3: #9e9e9e;
  --ink-4: #696969;
  --ink-on-bar: #dedede;
  --ink-inverse: #ffffff;
  --line: #333333;
  --line-2: #262626;
  --line-control: #696969;
  --line-ink: #dedede;
  --line-on-bar: #ffffff2e;
  --track: #ffffff14;
  --action: #2b59ff;
  --action-hover: #1d43ea;
  --on-action: #ffffff;
  --accent: #c0a3fa;
  --accent-soft: #2e2849;
  --on-accent: #0f0f0f;
  --highlight: #ffe14d;
  --highlight-ink: #ffe14d;
  --focus: #c0a3fa;
  --focus-on-bar: #ffe14d;
  --done: #5cc48a;
  --done-soft: #163626;
  --on-done: #0f0f0f;
  --wait: #ddc97b;
  --wait-soft: #352f1d;
  --rework: #f08a80;
  --rework-soft: #3a1f24;
  --rework-line: #7a3a3a;
  --map-directing: #8ad0f2;
  --map-driving: #8bd8ae;
  --map-doing: #cdb0e8;
  --map-delivering: #eba3bf;
  --map-field-directing: #15304a;
  --map-field-driving: #163426;
  --map-field-doing: #2a2540;
  --map-field-delivering: #3a2231;
  --shadow-card: 0 1px 2px #00000066;
  --shadow-pop: 0 18px 40px #00000080;
  --shadow-focus: 0 0 0 2px #191919, 0 0 0 4px #c0a3fa;
}
:root {
  --space-2: 2px;
  --space-4: 4px;
  --space-6: 6px;
  --space-8: 8px;
  --space-12: 12px;
  --space-16: 16px;
  --space-20: 20px;
  --space-24: 24px;
  --space-32: 32px;
  --space-44: 44px;
  --radius-none: 0px;
  --radius-xs: 2px;
  --radius-sm: 4px;
  --radius-md: 8px;
  --radius-lg: 12px;
  --radius-xl: 24px;
  --radius-pill: 999px;
  --border-hair: 1px;
  --border-pill: 1.5px;
  --border-active: 2px;
  --border-frame: 3px;
  --size-topbar: 56px;
  --size-sidebar: 320px;
  --size-aside: 280px;
  --size-cta: 36px;
  --size-control: 28px;
  --size-control-sm: 18px;
  --size-avatar: 20px;
  --z-overlay: 10;
  --z-popover: 100;
  --z-tutorial-backdrop: 900;
  --z-tutorial-ring: 905;
  --z-tutorial-card: 910;
  --z-tooltip: 1000;
  --font-display: "Archivo", system-ui, sans-serif;
  --font-sans: "Archivo", system-ui, sans-serif;
  --font-mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  --font-hand: "Kalam", "Comic Neue", cursive;
}
</style>
<style>
/* Org Flow — styly komponent. Hodnoty barev, mezer, rádiusů a stínů bere z tokens.css
   (var(--…)); velikosti písma kopírují typové styly z tokens.json (jméno stylu je v komentáři). */


body {
  margin: 0;
  background: var(--surface-page);
  color: var(--ink);
  font: 400 13px/20px var(--font-sans); /* body */
  -webkit-font-smoothing: antialiased;
}

.of-stage { padding: var(--space-16); display: flex; flex-wrap: wrap; gap: var(--space-12); align-items: flex-start; }
.of-stack { display: flex; flex-direction: column; gap: var(--space-8); }
.of-row { display: flex; align-items: center; gap: var(--space-6); flex-wrap: wrap; }
.of-caption { font: 500 10px/12px var(--font-mono); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-3); } /* label */

:focus-visible { outline: var(--border-active) solid var(--focus); outline-offset: 2px; }
.of-topbar :focus-visible, .of-tutorial :focus-visible { outline-color: var(--focus-on-bar); }

/* ── Text helpers (zrcadlí typové styly) ─────────────────────────────────── */
.of-eyebrow { font: 500 11px/16px var(--font-mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-3); }
.of-label   { font: 600 10px/12px var(--font-mono); letter-spacing: .8px;  text-transform: uppercase; color: var(--ink-3); }
.of-code    { font: 500 11px/16px var(--font-mono); font-variant-numeric: tabular-nums; }
.of-micro   { font: 600 10px/12px var(--font-mono); font-variant-numeric: tabular-nums; }
.of-heading { font: 800 20px/22px var(--font-display); text-transform: uppercase; margin: 0; }
.of-hand    { font: 700 20px/22px var(--font-hand); }

/* ── Button ──────────────────────────────────────────────────────────────── */
.of-btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-6);
  height: var(--size-control); padding: 0 var(--space-12);
  border: var(--border-hair) solid var(--line-control); border-radius: var(--radius-none);
  background: var(--surface-panel); color: var(--ink);
  font: 800 13px/16px var(--font-sans); letter-spacing: .3px; text-transform: uppercase; /* button */
  cursor: pointer; white-space: nowrap;
  transition: background .15s, border-color .15s, color .15s;
}
/* :where() drží specificitu základního hoveru nízko, aby ho varianty (--done, --primary…) vždy přebily */
.of-btn:where(:hover:not(:disabled)) { background: var(--surface-subtle); }
.of-btn:disabled { opacity: .45; cursor: default; }
.of-btn--primary { height: var(--size-cta); padding: 0 var(--space-20); background: var(--action); border-color: var(--action); color: var(--on-action); }
.of-btn--primary:hover { background: var(--action-hover); border-color: var(--action-hover); }
.of-btn--running { height: var(--size-cta); padding: 0 var(--space-20); background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.of-btn--running:hover { background: var(--accent); }
.of-btn--done { height: var(--size-cta); padding: 0 var(--space-20); background: var(--done); border-color: var(--done); color: var(--on-done); }
.of-btn--done:disabled { opacity: 1; } /* Done je stav, ne vypnutá akce */
.of-btn--strong { background: var(--ink); border-color: var(--ink); color: var(--surface-panel); }
.of-btn--strong:hover { background: var(--ink-2); border-color: var(--ink-2); }
.of-btn--ghost { background: transparent; border-color: transparent; color: var(--ink-2); }
.of-btn--ghost:hover { background: var(--surface-subtle); }
.of-btn--light { background: var(--ink-inverse); border-color: var(--ink-inverse); color: var(--surface-bar); }
.of-btn--light:hover { background: var(--ink-on-bar); }
.of-btn--on-bar { background: transparent; border-color: var(--line-on-bar); color: var(--ink-on-bar); }
.of-btn--on-bar:hover { background: var(--line-on-bar); }
.of-btn .of-glyph { font-size: 11px; line-height: 1; }

.of-icon-btn {
  width: var(--size-control); height: var(--size-control); padding: 0; flex-shrink: 0;
  display: inline-flex; align-items: center; justify-content: center;
  border: var(--border-hair) solid var(--line-control); border-radius: var(--radius-pill);
  background: transparent; color: var(--ink-3);
  font: 700 13px/1 var(--font-mono); cursor: pointer;
}
.of-icon-btn:hover { color: var(--ink); border-color: var(--ink-3); }
.of-icon-btn--on-bar { border-color: var(--line-on-bar); color: var(--ink-on-bar); }

/* ── Segmented control (typ týmu, preset, rychlost) ───────────────────────── */
.of-seg {
  display: inline-grid; grid-auto-flow: column; grid-auto-columns: 1fr;
  padding: var(--space-2); gap: var(--space-2);
  border: var(--border-hair) solid var(--line-control); border-radius: var(--radius-sm);
  background: var(--surface-panel);
}
.of-seg button {
  height: 22px; padding: 0 var(--space-12); border: 0; border-radius: var(--radius-none);
  background: transparent; color: var(--ink-3);
  font: 600 10px/12px var(--font-mono); letter-spacing: .8px; text-transform: uppercase; /* label */
  cursor: pointer; white-space: nowrap; transition: background .2s, color .15s;
}
.of-seg button:hover { color: var(--ink); }
.of-seg button[aria-pressed="true"] { background: var(--ink); color: var(--surface-panel); }
.of-seg[aria-disabled="true"] { opacity: .45; pointer-events: none; }
.of-seg--on-bar { background: transparent; border-color: var(--line-on-bar); }
.of-seg--on-bar button { color: var(--ink-on-bar); }
.of-seg--on-bar button:hover { color: var(--ink-inverse); }
.of-seg--on-bar button[aria-pressed="true"] { background: var(--ink-on-bar); color: var(--surface-bar); }

.of-hint {
  position: absolute; z-index: var(--z-popover); top: calc(100% + 8px); left: 0;
  width: max-content; max-width: 260px; padding: var(--space-6) var(--space-12);
  background: var(--surface-bar); color: var(--ink-on-bar);
  font: 400 12px/16px var(--font-sans); border-radius: var(--radius-sm); box-shadow: var(--shadow-pop);
}

/* ── Top bar ─────────────────────────────────────────────────────────────── */
.of-topbar {
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: stretch;
  height: var(--size-topbar); padding: 0 var(--space-20);
  background: var(--surface-bar); color: var(--ink-on-bar);
}
.of-brand { display: flex; align-items: center; gap: var(--space-12); }
.of-mark { width: 28px; height: 28px; flex-shrink: 0; display: block; }
.of-wordmark { display: flex; flex-direction: column; gap: 3px; white-space: nowrap; }
.of-wordmark b { font: 800 15px/18px var(--font-display); letter-spacing: .6px; text-transform: uppercase; color: var(--ink-inverse); } /* wordmark */
.of-wordmark span { font: 600 10px/10px var(--font-mono); letter-spacing: 1.2px; text-transform: uppercase; color: var(--highlight); }
.of-tabs { display: flex; align-items: stretch; }
.of-tab {
  display: flex; align-items: center; padding: 0 var(--space-20);
  border: 0; border-bottom: 3px solid transparent; border-top: 3px solid transparent; background: transparent; white-space: nowrap;
  color: var(--ink-on-bar); font: 800 13px/16px var(--font-sans); letter-spacing: .3px; text-transform: uppercase;
  cursor: pointer;
}
.of-tab:hover { color: var(--ink-inverse); }
.of-tab[aria-selected="true"] { color: var(--ink-inverse); border-bottom-color: var(--highlight); }
.of-controls { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-8); }

/* ── Panel + hlavička sloupce ────────────────────────────────────────────── */
.of-panel { background: var(--surface-panel); border: var(--border-hair) solid var(--line); border-radius: var(--radius-lg); overflow: hidden; }
.of-panel-head {
  display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-8);
  padding: var(--space-12) var(--space-16) var(--space-8);
}
.of-panel-head h3 { margin: 0; font: 500 11px/16px var(--font-mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-2); } /* eyebrow */
.of-panel-head .of-count { font: 500 11px/16px var(--font-mono); color: var(--ink-3); }
.of-panel-head .of-aside { font: 400 12px/16px var(--font-sans); color: var(--ink-3); }

.of-col { display: flex; flex-direction: column; min-width: 0; background: var(--surface-subtle); }
.of-col + .of-col { border-left: var(--border-hair) solid var(--line-2); }
.of-col-head {
  display: flex; justify-content: space-between; align-items: center;
  padding: var(--space-6) var(--space-12);
  font: 500 11px/16px var(--font-mono); letter-spacing: 1.1px; text-transform: uppercase; /* eyebrow */
  color: var(--ink-2); background: var(--surface-panel); border-bottom: var(--border-hair) solid var(--line-2);
}
.of-col-head--doing { background: var(--accent-soft); color: var(--accent); }
.of-col-head--done  { background: var(--done-soft);   color: var(--done); }
.of-col-head .of-count { color: var(--ink-3); }
.of-col-body { padding: var(--space-8); display: flex; flex-direction: column; gap: var(--space-6); }
.of-empty { font: 400 12px/16px var(--font-sans); color: var(--ink-3); }

/* ── Feature card ────────────────────────────────────────────────────────── */
.of-feature {
  --hue: 215;
  display: flex; flex-direction: column; gap: var(--space-6);
  padding: var(--space-8) 10px; border-radius: var(--radius-md);
  background: oklch(97.5% 0.02 var(--hue)); border: var(--border-hair) solid oklch(86% 0.05 var(--hue));
}
[data-theme="dark"] .of-feature { background: oklch(28% 0.03 var(--hue)); border-color: oklch(42% 0.05 var(--hue)); }
.of-feature--neutral, [data-theme="dark"] .of-feature--neutral { background: var(--surface-panel); border-color: var(--line); }
.of-feature[data-active="true"] { box-shadow: 0 0 0 var(--border-active) var(--ink); }
.of-feature-top { display: flex; justify-content: space-between; align-items: center; gap: var(--space-6); }
.of-feature-name { font: 500 11px/16px var(--font-mono); color: var(--ink-2); flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.of-feature-meta { display: flex; align-items: center; gap: var(--space-4); flex-shrink: 0; }
.of-tasks-count { font: 600 10px/12px var(--font-mono); color: var(--ink-3); }
.of-revenue { font: 700 10px/12px var(--font-mono); color: var(--done); }
.of-bar { height: 20px; display: flex; gap: var(--space-2); border-radius: var(--radius-xs); overflow: hidden; background: var(--track); }
.of-bar--compact { height: 6px; }
.of-seg-task { position: relative; overflow: hidden; background: var(--track); display: flex; align-items: center; justify-content: center; }
.of-seg-task i { position: absolute; inset: 0 auto 0 0; background: var(--role); }
.of-seg-task[data-status="todo"] i { inset: 0; opacity: .25; }
.of-seg-task[data-status="rework"] { box-shadow: inset 0 0 0 1.5px var(--rework); }
.of-seg-task--flash::after { content: ''; position: absolute; inset: 0; background: var(--rework); opacity: 0; animation: of-flash 1.2s ease-out; }
@keyframes of-flash { 0% { opacity: .85; } 100% { opacity: 0; } }
.of-seg-task b { position: relative; font: 700 11px/1 var(--font-sans); color: var(--ink-inverse); text-shadow: 0 0 2px #00000059; }

/* ── Chips ───────────────────────────────────────────────────────────────── */
.of-role {
  display: inline-flex; align-items: center; gap: var(--space-4);
  height: var(--size-control-sm); padding: 0 var(--space-6);
  background: var(--role, var(--role-slate)); color: var(--ink-inverse); border: 0; border-radius: var(--radius-xs);
  font: 600 11px/1 var(--font-sans); letter-spacing: .2px; white-space: nowrap;
}
button.of-role { cursor: pointer; }
.of-role-x {
  width: 12px; height: 12px; padding: 0; border: 0; border-radius: var(--radius-xs);
  display: inline-flex; align-items: center; justify-content: center;
  background: #ffffff40; color: var(--ink-inverse); font: 600 10px/1 var(--font-sans); cursor: pointer;
}
.of-role-add {
  height: var(--size-control-sm); min-width: var(--size-control-sm); padding: 0 var(--space-4);
  border: var(--border-hair) dashed var(--line-control); border-radius: var(--radius-xs);
  background: transparent; color: var(--ink-3); font: 600 10px/1 var(--font-mono); cursor: pointer;
}
.of-chip {
  display: inline-flex; align-items: center; gap: var(--space-2);
  padding: var(--space-2) 5px; border: var(--border-hair) solid; border-radius: var(--radius-xs);
  font: 600 10px/12px var(--font-mono); white-space: nowrap; /* micro */
}
.of-chip--handoff { color: var(--ink-2); background: var(--surface-subtle); border-color: var(--line); }
.of-chip--rework  { color: var(--rework); background: var(--rework-soft); border-color: var(--rework-line); }
.of-chip--pulse { animation: of-chip-pulse 1.4s ease-out; }
@keyframes of-chip-pulse { 0% { transform: scale(1); } 15% { transform: scale(1.22); } 100% { transform: scale(1); } }
.of-pill {
  display: inline-flex; align-items: center; padding: var(--space-2) 10px;
  border: var(--border-pill) solid var(--line-ink); border-radius: var(--radius-pill);
  background: var(--surface-highlight); color: var(--ink); font: 700 11px/16px var(--font-mono);
}

/* ── Member card ─────────────────────────────────────────────────────────── */
.of-member {
  display: flex; flex-direction: column; gap: var(--space-6); min-width: 0;
  padding: var(--space-8) 10px; background: var(--surface-panel);
  border: var(--border-hair) solid var(--line); border-radius: var(--radius-md);
}
.of-member[data-state="waiting"] { background: var(--wait-soft); border-color: var(--wait); }
.of-member-top { display: flex; align-items: center; gap: var(--space-6); }
.of-avatar {
  width: var(--size-avatar); height: var(--size-avatar); flex-shrink: 0; border-radius: var(--radius-pill);
  display: flex; align-items: center; justify-content: center;
  background: var(--ink); color: var(--surface-panel); font: 700 10px/1 var(--font-mono);
}
.of-member-name { flex: 1; min-width: 0; font: 600 13px/20px var(--font-sans); color: var(--ink); } /* body-strong */
.of-mini {
  height: var(--size-control-sm); min-width: var(--size-control-sm); padding: 0 var(--space-4);
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  border: var(--border-hair) solid var(--line-control); border-radius: var(--radius-xs);
  background: transparent; color: var(--ink-3); font: 600 10px/1 var(--font-mono); cursor: pointer;
}
.of-mini[aria-pressed="true"], .of-mini--ai-on { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.of-member-task { display: flex; flex-direction: column; gap: var(--space-4); min-height: 32px; justify-content: flex-end; }
.of-member-line { display: flex; align-items: center; gap: var(--space-4); font: 500 11px/16px var(--font-mono); color: var(--ink-2); white-space: nowrap; overflow: hidden; }
.of-member-line .of-swatch { width: 8px; height: 8px; border-radius: var(--radius-xs); flex-shrink: 0; background: oklch(68% 0.13 var(--hue, 215)); }
.of-member-line .of-feature-name { flex: 1; }
.of-progress { height: 6px; border-radius: var(--radius-xs); background: var(--track); overflow: hidden; }
.of-progress i { display: block; height: 100%; background: var(--role, var(--ink-3)); }

/* ── Stat tile ───────────────────────────────────────────────────────────── */
.of-stat {

  padding: 10px var(--space-12); background: var(--surface-panel);

}
.of-stat-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-6); }
.of-stat-label { font: 600 10px/12px var(--font-mono); letter-spacing: .8px; text-transform: uppercase; color: var(--ink-3); display: inline-flex; align-items: center; gap: var(--space-4); }
.of-stat-value { font: 600 20px/24px var(--font-mono); font-variant-numeric: tabular-nums; color: var(--ink); } /* metric */

.of-stat--timer .of-stat-value { font-size: 28px; line-height: 30px; letter-spacing: -.6px; } /* metric-xl */
.of-stat--done { background: var(--done-soft); border-color: var(--done); }

.of-delta { font: 600 10px/12px var(--font-mono); }
.of-delta--good { color: var(--done); }
.of-delta--bad { color: var(--rework); }

.of-stat-hint { font: 400 12px/16px var(--font-sans); color: var(--ink-3); }
.of-split { display: flex; height: 6px; gap: var(--space-2); border-radius: var(--radius-xs); overflow: hidden; }

.of-tooltip {

}

.of-tooltip b { color: var(--ink-inverse); font-weight: 700; }

/* ── Slider ──────────────────────────────────────────────────────────────── */
.of-slider { display: flex; flex-direction: column; gap: var(--space-4); width: 100%; }
.of-slider-head { display: flex; justify-content: space-between; align-items: center; gap: var(--space-8); }

.of-range::-webkit-slider-runnable-track { height: 4px; background: var(--line-control); border-radius: var(--radius-pill); }
.of-range::-moz-range-track { height: 4px; background: var(--line-control); border-radius: var(--radius-pill); }
.of-range::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; margin-top: -5px; border-radius: var(--radius-pill); background: var(--ink); box-shadow: 0 0 0 2px var(--surface-panel); }

.of-overlay {

.of-dialog {

}

.of-dialog .of-row { gap: var(--space-6); }

/* ── Result frame (WinnerBanner) ─────────────────────────────────────────── */
.of-result {

@keyframes of-ring { 0%, 100% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--accent) 55%, transparent); } 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--accent) 0%, transparent); } }

/* ── Lead time chart ─────────────────────────────────────────────────────── */
.of-chart { position: relative; height: 130px; padding: 6px var(--space-8) 16px 32px; }

.of-ref span { z-index: 1; position: absolute; top: -13px; padding: 0 var(--space-4); background: var(--surface-subtle); font: 600 10px/12px var(--font-mono); }

.of-ref--p85 span { right: var(--space-4); color: var(--wait); }
.of-dot { position: absolute; width: 6px; height: 6px; border-radius: var(--radius-pill); background: var(--accent); transform: translate(-50%, -50%); box-shadow: 0 0 0 1.5px var(--surface-subtle); }
.of-axis-y { position: absolute; left: 0; top: 6px; bottom: 16px; width: 28px; display: flex; flex-direction: column; justify-content: space-between; text-align: right; font: 500 10px/12px var(--font-mono); color: var(--ink-3); }
.of-axis-x { position: absolute; left: 32px; right: var(--space-8); bottom: 0; display: flex; justify-content: space-between; font: 500 10px/12px var(--font-mono); color: var(--ink-3); }
.of-chart-empty { height: 130px; display: flex; align-items: center; justify-content: center; border: var(--border-hair) dashed var(--line-control); border-radius: var(--radius-sm); font: 400 12px/16px var(--font-sans); color: var(--ink-3); }

/* ── Revenue curve preview ───────────────────────────────────────────────── */
.of-curve svg { display: block; width: 100%; max-width: 250px; height: 46px; overflow: visible; }
.of-curve .flat { stroke: var(--ink-3); stroke-width: .8; stroke-dasharray: 2 2; }
.of-curve .flat-label { font: 500 10px var(--font-mono); fill: var(--ink-3); }

.of-curve figcaption { margin-top: var(--space-2); font: 400 12px/16px var(--font-sans); color: var(--ink-3); }

/* ── Team map (záměrné rozšíření) ────────────────────────────────────────── */
.of-map { display: grid; grid-template-columns: 22px 1fr; grid-template-rows: 1fr 22px; gap: var(--space-6); }
.of-map-y { writing-mode: vertical-rl; transform: rotate(180deg); text-align: center; }
.of-map-x { grid-column: 2; text-align: center; }
.of-map-y, .of-map-x { font: 500 10px/12px var(--font-mono); letter-spacing: 1.1px; text-transform: uppercase; color: var(--ink-3); }
.of-map-y b, .of-map-x b { color: var(--ink); font-weight: 700; }
.of-map-field { position: relative; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: var(--space-4); }
.of-quad { position: relative; padding: var(--space-8) 10px; border-radius: var(--radius-xs); }
.of-quad span { font: 600 10px/12px var(--font-mono); letter-spacing: 1.1px; text-transform: uppercase; }
.of-quad--directing  { background: var(--map-field-directing); }
.of-quad--directing span  { color: var(--map-directing); }
.of-quad--driving    { background: var(--map-field-driving); }
.of-quad--driving span    { color: var(--map-driving); }
.of-quad--doing      { background: var(--map-field-doing); }
.of-quad--doing span      { color: var(--map-doing); }
.of-quad--delivering { background: var(--map-field-delivering); }
.of-quad--delivering span { color: var(--map-delivering); }
.of-map-svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none; }
.of-map-svg .unit { fill: var(--surface-panel); stroke: var(--ink); stroke-width: 2; }

.of-map-svg .head { fill: var(--ink-2); }
.of-map-svg text { font: 700 15px var(--font-hand); fill: var(--ink); } /* annotation-sm */

</style>

  function rng(seed) { return function () { seed |= 0; seed = seed + 0x6D2B79F5 | 0; var t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
  // Iniciála člena; u jednotek „Team C“ písmeno týmu, jinak by všechny měly „T“
  function initial(n) { return /^Team /.test(n) ? n.slice(5, 6) : n[0]; }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;'); }
  function pad(n) { return (n < 10 ? '0' : '') + n; }
  function fmtTime(s) { var m = Math.floor(s / 60); return pad(m) + ':' + pad(Math.floor(s % 60)) + '.' + Math.floor((s * 10) % 10); }
  function fmtEur(n) { return '€' + Math.round(n).toLocaleString('en-US'); }

  function makeBacklog(count, roles, seed) {
    var r = rng(seed), list = [];
    for (var i = 0; i < count; i++) {
      var n = 3 + Math.floor(r() * 3), pool = roles.slice(), picked = [];
      while (picked.length < n) picked.push(pool.splice(Math.floor(r() * pool.length), 1)[0]);
      picked.sort(function (a, b) { return roles.indexOf(a) - roles.indexOf(b); });
      list.push({
        id: i + 1, name: 'F-' + String(i + 1).padStart(3, '0') + ' ' + FEATURE_NAMES[i % FEATURE_NAMES.length],
        hue: FEATURE_HUES[i % FEATURE_HUES.length], revenue: Math.round(260 + r() * 180),
        tasks: picked.map(function (role, k) { return { id: k, role: role, work: 2 + r() * 4, progress: 0, status: 'todo', who: null }; }),
        handoffs: 0, reworks: 0, lastWho: null

    }
    return list;
  }
  function cloneBacklog(b) { return b.map(function (f) { var c = Object.assign({}, f); c.tasks = f.tasks.map(function (t) { return Object.assign({}, t); }); return c; }); }

  function makeTeam(names, rolesFor, backlog, seed) {
    return {
      members: names.map(function (n, i) { return { name: n, roles: rolesFor(i), task: null, feature: null, ai: 1 }; }),
      backlog: backlog, inProgress: [], done: [], t: 0, wipArea: 0, wait: 0, revenue: 0,
      finished: false, started: false, r: rng(seed)
    };
  }

  // ── Zjednodušená simulace (jen pro maketu) ───────────────────────────────
  function step(team, dt) {
    if (team.finished) return;
    team.t += dt;
    team.wipArea += team.inProgress.length * dt;
    team.done.forEach(function (f) { team.revenue += f.revenue * dt / 3; });
    team.members.forEach(function (m) {
      if (!m.task) return;
      m.task.progress += dt * m.ai;
      if (m.task.progress < m.task.work) return;
      var f = m.feature, t = m.task;
      t.progress = t.work; t.status = 'done'; m.task = null; m.feature = null;
      // Rework: test občas vrátí předchozí task (zbylý progres zůstává)
      if ((t.role === 'QA' || t.role === 'ITST') && t.id > 0 && team.r() < 0.12) {
        var prev = f.tasks[t.id - 1]; prev.status = 'todo'; prev.progress = prev.work * 0.5; prev.who = null;
        t.status = 'todo'; t.progress = 0; t.who = null; f.reworks++; f.flash = true;
        return;
      }
      if (f.tasks.every(function (x) { return x.status === 'done'; })) {
        f.doneAt = team.t; f.lead = team.t - f.startedAt;
        team.inProgress.splice(team.inProgress.indexOf(f), 1); team.done.push(f);
      }
    });
    team.members.forEach(function (m) {
      if (m.task) return;
      var pick = null;
      for (var i = 0; i < team.inProgress.length && !pick; i++) {
        var f = team.inProgress[i], next = f.tasks.filter(function (x) { return x.status !== 'done'; })[0];
        if (next && next.status === 'todo' && m.roles.indexOf(next.role) >= 0) pick = [f, next];
      }
      if (!pick && team.inProgress.length < WIP_LIMIT) {
        for (var j = 0; j < team.backlog.length && !pick; j++) {
          if (m.roles.indexOf(team.backlog[j].tasks[0].role) >= 0) {
            var nf = team.backlog.splice(j, 1)[0]; nf.startedAt = team.t; team.inProgress.push(nf); pick = [nf, nf.tasks[0]];
          }
        }
      }
      if (pick) {
        if (pick[0].lastWho && pick[0].lastWho !== m.name) pick[0].handoffs++;
        pick[0].lastWho = m.name; pick[1].status = 'doing'; pick[1].who = m.name; m.task = pick[1]; m.feature = pick[0];
      } else if (team.backlog.length || team.inProgress.length) { m.waiting = true; team.wait += dt; return; }
      m.waiting = false;
    });
    if (!team.backlog.length && !team.inProgress.length) team.finished = true;
  }
  function advance(team, dt) { while (dt > 0) { var d = Math.min(0.1, dt); step(team, d); dt -= d; } }
  function stats(team) {

    var leads = team.done.map(function (f) { return f.lead; }).sort(function (a, b) { return a - b; });
    return { count: n, avg: n ? sum / n : 0, wip: team.t ? team.wipArea / team.t : 0, handoffs: n ? ho / n : 0,
             p85: n ? leads[Math.min(n - 1, Math.floor(n * 0.85))] : 0, max: n ? leads[n - 1] : 0 };
  }

  // ── Stavební kameny UI (třídy z bundle.css) ──────────────────────────────
  function roleChip(role, removable) {
    var r = ROLE[role];
    return '<span class="of-role" style="--role:var(--role-' + r[1] + ')">' + r[0] + (removable ? ' <button class="of-role-x" aria-label="Remove ' + r[0] + '">×</button>' : '') + '</span>';
  }
  function bar(f, compact, coord) {
    var total = f.tasks.reduce(function (s, t) { return s + t.work; }, 0);
    return '<div class="of-bar' + (compact ? ' of-bar--compact' : '') + '">' + f.tasks.map(function (t) {
      var st = t.status === 'todo' && t.progress > 0 ? 'rework' : t.status;
      var w = t.status === 'done' ? 100 : (t.progress / t.work) * 100;
      var label = compact ? '' : t.status === 'doing' ? '<b>' + initial(t.who) + '</b>' : t.status === 'done' ? '<b>✓</b>' : '';
      return '<div class="of-seg-task' + (coord && st === 'rework' && f.flash ? ' of-seg-task--flash' : '') + '" data-status="' + st + '" style="width:' + (t.work / total * 100).toFixed(1) + '%; --role:var(--role-' + ROLE[t.role][1] + ')"><i' + (st === 'todo' ? '' : ' style="width:' + w.toFixed(0) + '%"') + '></i>' + label + '</div>';
    }).join('') + '</div>';
  }
  function featureCard(f, opts) {
    opts = opts || {};

    var meta = '';

      if (f.reworks) meta += '<span class="of-chip of-chip--rework">↺ ' + f.reworks + '</span>';
    }
    if (opts.revenue) meta += '<span class="of-revenue">€' + f.revenue + '/tick</span>';

    return '<div class="of-feature' + (opts.neutral ? ' of-feature--neutral' : '') + '" style="--hue:' + f.hue + '"' + (opts.activeRing && active ? ' data-active="true"' : '') + '>' +
      '<div class="of-feature-top"><span class="of-feature-name">' + esc(f.name) + '</span><span class="of-feature-meta">' + meta + '</span></div>' + bar(f, opts.compact, opts.coord) + '</div>';
  }
  function memberCard(m, team, opts) {
    var body;

             '<div class="of-progress" style="--role:var(--role-' + ROLE[m.task.role][1] + ')"><i style="width:' + (m.task.progress / m.task.work * 100).toFixed(0) + '%"></i></div>';
    } else body = '<span class="of-state">' + (team.started && m.waiting && !team.finished ? 'Waiting…' : 'Idle') + '</span>';
    var waiting = team.started && !m.task && m.waiting && !team.finished;
    var tools = '';

        ? '<button class="of-mini of-mini--ai-on" data-ai="' + m.name + '" aria-label="AI speed-up ' + m.ai + '×"><svg width="8" height="10" viewBox="0 0 8 10" aria-hidden="true"><path d="M5 0 L0 6 H3.5 L2.5 10 L8 3.5 H4.5 Z" fill="currentColor"/></svg>' + m.ai + '×</button>'

      '<div class="of-row" style="gap:var(--space-4)">' + m.roles.map(function (r) { return roleChip(r, opts.tools); }).join('') + (opts.tools ? '<button class="of-role-add" aria-label="Add specialization">+</button>' : '') + '</div>' +

  }
  function helpLabel(label, tip) {
    return '<span class="of-stat-label">' + label + (tip ? ' <span class="of-help"><button class="of-help-btn" aria-label="About ' + label + '">?</button><span class="of-tooltip" role="tooltip">' + tip + '</span></span>' : '') + '</span>';
  }
  function delta(cur, prev, higherIsBetter) {

  function timerTile(team) {

  function chart(team) {

    }).join('');

      '<div class="of-plot"><div class="of-grid" style="top:25%"></div><div class="of-grid" style="top:50%"></div><div class="of-grid" style="top:75%"></div>' +
      '<div class="of-ref of-ref--p85" style="top:' + ((1 - s.p85 / maxY) * 100).toFixed(1) + '%"><span>p85 ' + s.p85.toFixed(1) + 's</span></div>' +
      '<div class="of-ref of-ref--avg" style="top:' + ((1 - s.avg / maxY) * 100).toFixed(1) + '%"><span>avg ' + s.avg.toFixed(1) + 's</span></div>' + dots + '</div>' +

  // ── Stav makety ──────────────────────────────────────────────────────────
  var mode = 'compare';

  function resetCompare() {

      cmp.teams[k] = makeTeam(MEMBER_NAMES, function (m) { var r = []; for (var x = 0; x < per; x++) r.push(COMPARE_ROLES[(m + x) % 6]); return r; }, cloneBacklog(backlog), 11 + i);

    L.team = makeTeam(['Team A', 'Team B', 'Team C', 'Team D', 'Team E', 'Team F'], function (i) { return [TEAMS_ROLES[i]]; }, backlog, 31);
    if (warm) { L.team.members[2].ai = 5; L.team.started = true; advance(L.team, warm); }

  }

  // ── Render ───────────────────────────────────────────────────────────────

  function renderCompareTeam(k) {

        '<div class="settings"><span class="of-eyebrow">Settings</span><span class="of-slider-label">Unit preset</span>' +
          seg('Teams / People', [['teams', 'Teams'], ['people', 'People']], 'teams', 'data-preset') + accBacklog +
          accHead('spec', 'Specializations') + '<div class="acc-body"><div class="of-row" style="gap:var(--space-4)">' + TEAMS_ROLES.map(function (r) { return roleChip(r, false); }).join('') + '<button class="of-role-add" aria-label="Add specialization">+</button></div><span class="of-stat-hint">Each slot keeps its colour across presets.</span></div></div>' +
          accHead('team', 'Team') + '<div class="acc-body"><label class="of-slider"><span class="of-slider-head"><span class="of-slider-label">Units</span><span class="of-slider-value">' + T.members.length + '</span></span><input class="of-range" type="range" min="1" max="8" value="' + T.members.length + '" aria-label="Units"></label></div></div>' +
        '</div>' +
      '</aside>' +
      '<section class="center">' +
        '<div class="of-panel-head"><h3>In progress <span class="of-count">' + T.inProgress.length + '</span></h3><span class="of-aside">auto-scaled</span></div>' +
        '<div class="inprog">' + (T.inProgress.map(function (f) { return featureCard(f, { activeRing: true, revenue: cash, coord: cash }); }).join('') || '<div class="of-empty">Nothing in flight.</div>') + '</div>' +
        '<div class="units"><div class="of-panel-head"><h3>Units <span class="of-count">' + T.members.length + '</span></h3><span class="of-aside">Click + to add a specialty</span></div>' +
          '<div class="units-grid">' + T.members.map(function (m) { return memberCard(m, T, { tools: true }); }).join('') + '</div>' +
          '<button class="of-btn add-unit">+ Add ' + (cash ? 'team' : 'unit') + '</button></div>' +
      '</section>' +
      '<aside class="aside">' +
        '<div class="of-panel-head"><h3>Metrics</h3><span class="of-aside">' + s.count + ' features sampled</span></div>' +
        '<div class="metrics">' + timerTile(T) +
          tile('Avg cycle time', s.count ? s.avg.toFixed(1) : '—', s.count ? 's' : '', { tip: '<b>Cycle time.</b> Average time from start to done.', extra: delta(s.avg, prev.avg) }) +
          tile('Avg WIP', T.t ? s.wip.toFixed(1) : '—', '', { tip: '<b>Work in progress.</b> Average number of features started but not finished.', extra: delta(s.wip, prev.wip) }) +
          (cash ? tile('Revenue (time-matched)', fmtEur(T.revenue), '', { color: 'var(--done)', tip: '<b>Revenue in shared time.</b> Earned by delivered features up to now.', extra: delta(T.revenue, prev.revenue, true) + '<span class="of-stat-hint">Details ▾</span>' })
                : tile('Total wait', T.wait.toFixed(1), 's', { tip: '<b>Waiting.</b> Time units spent idle while work remained.', extra: delta(T.wait, prev.wait) }) +
                  tile('Avg handoffs', s.count ? s.handoffs.toFixed(1) : '—', '', { tip: '<b>Hand-offs.</b> How often a feature changed hands.', extra: delta(s.handoffs, prev.handoffs) })) +
          (cash ? '' : chart(T)) +
        '</div>' +
        '<div class="of-panel-head"><h3>Done <span class="of-count">' + T.done.length + '</span></h3></div>' +
        '<div class="done-list">' + (T.done.slice().reverse().map(function (f) {
          return '<div class="done-row" style="--hue:' + f.hue + '"><span class="of-swatch"></span><span class="name">' + esc(f.name) + '</span>' +
            (cash ? '<span class="rev">€' + f.revenue + '/tick</span>' : '<span class="val">' + f.lead.toFixed(1) + 's</span>') + '</div>';
        }).join('') || '<div class="of-empty">No completed features yet.</div>') + '</div>' +
      '</aside>';
    // Překreslení nesmí uživateli shodit pozici scrollu v seznamech
    var view = document.getElementById('view-' + key), keep = {};
    ['.side-list', '.inprog', '.done-list'].forEach(function (sel) { var n = view.querySelector(sel); if (n) keep[sel] = n.scrollTop; });
    view.innerHTML = html;
    Object.keys(keep).forEach(function (sel) { view.querySelector(sel).scrollTop = keep[sel]; });
  }

  function render() {
    renderControls();
    if (mode === 'compare') { renderWinner(); renderCompareTeam('A'); renderCompareTeam('B'); }
    else renderLab(mode);
  }

  // ── Události ─────────────────────────────────────────────────────────────
  // Během běhu se UI překresluje 10× za sekundu, takže klik (mousedown → mouseup) by mohl trefit
  // už vyměněný prvek. Myš proto obsluhujeme na pointerdown, klávesnici přes click (detail === 0).
  document.addEventListener('pointerdown', function (e) { if (e.button === 0) handle(e); });
  document.addEventListener('click', function (e) { if (e.detail === 0) handle(e); });
  function handle(e) {
    var b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode) {
      mode = b.dataset.mode;
      document.querySelectorAll('.of-tab').forEach(function (t) { t.setAttribute('aria-selected', String(t === b)); });
      document.querySelectorAll('.view').forEach(function (v) { v.classList.toggle('on', v.id === 'view-' + mode); });
      render(); return;
    }
    if (b.dataset.themeId) {
      document.documentElement.setAttribute('data-theme', b.dataset.themeId);
      document.querySelectorAll('#theme button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      return;
    }
    if (b.dataset.act === 'run') {
      if (mode === 'compare') { cmp.paused = !cmp.paused; cmp.teams.A.started = cmp.teams.B.started = true; }
      else { lab[mode].paused = !lab[mode].paused; lab[mode].team.started = true; }
      render(); return;
    }
    if (b.dataset.act === 'reset') {
      if (mode === 'compare') resetCompare();
      else { var T = lab[mode].team; if (T.finished || T.started) { var s = stats(T); lab[mode].prev = { avg: s.avg, wip: s.wip, wait: T.wait, handoffs: s.handoffs, revenue: T.revenue }; } resetLab(mode, 0); }
      render(); return;
    }
    if (b.dataset.speed) { if (mode === 'compare') cmp.speed = +b.dataset.speed; else lab[mode].speed = +b.dataset.speed; render(); return; }
    if (b.dataset.typeA || b.dataset.typeB) { if (b.dataset.typeA) cmp.types.A = b.dataset.typeA; else cmp.types.B = b.dataset.typeB; resetCompare(); render(); return; }
    if (b.dataset.curve) { lab[mode].curve = b.dataset.curve; render(); return; }
    if (b.dataset.ai) {
      lab[mode].team.members.forEach(function (m) { if (m.name === b.dataset.ai) m.ai = m.ai === 1 ? 2 : m.ai === 2 ? 5 : 1; });
      render(); return;
    }
    if (b.dataset.acc) { var o = lab[mode].open; o[b.dataset.acc] = !o[b.dataset.acc]; render(); }
  }

  // ── Smyčka ───────────────────────────────────────────────────────────────
  // setInterval místo requestAnimationFrame: běží (zpomaleně) i ve skryté záložce
  var last = performance.now(), acc = 0;
  function loop() {
    var now = performance.now(), dt = Math.min(1, (now - last) / 1000); last = now;
    var moved = false;
    if (mode === 'compare' && !cmp.paused) {
      advance(cmp.teams.A, dt * SIM_PER_REAL * cmp.speed); advance(cmp.teams.B, dt * SIM_PER_REAL * cmp.speed); moved = true;
      if (cmp.teams.A.finished && cmp.teams.B.finished) cmp.paused = true;
    } else if (mode !== 'compare' && !lab[mode].paused) {
      advance(lab[mode].team, dt * SIM_PER_REAL * lab[mode].speed); moved = true;
      if (lab[mode].team.finished) lab[mode].paused = true;
    }
    acc += dt;
    if (moved && acc > 0.1) {
      acc = 0;
      // Probliknutí reworku jen jednou
      render();
      [cmp.teams.A, cmp.teams.B, lab.advanced.team, lab.cashflow.team].forEach(function (T) { T.inProgress.forEach(function (f) { f.flash = false; }); });
    }
  }

  resetCompare();
  resetLab('advanced', 26);
  resetLab('cashflow', 22);
  render();
  setInterval(loop, 50);
})();
</script>
</body>
</html>
